[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-model-audit"
version = "0.1.1"
description = "Leakage, domain-shift, and rolling-validation diagnostics for time-series ML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Time-Series Model Audit contributors"}]
keywords = ["time-series", "machine-learning", "data-drift", "model-validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ts-model-audit = "ts_model_audit.cli:main"

[project.urls]
Homepage = "https://github.com/l1635733654-debug/time-series-model-audit"
Repository = "https://github.com/l1635733654-debug/time-series-model-audit"
Issues = "https://github.com/l1635733654-debug/time-series-model-audit/issues"
Changelog = "https://github.com/l1635733654-debug/time-series-model-audit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
